[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqd-nuclear"
version = "0.1.0"
description = "ADAPT-VQD simulations for shell-model nuclear Hamiltonians using pynucshell and Qibo."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Elena Serrano"}]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "qibo",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: slow regression tests",
]